name: Feature or improvement
description: Something this should do that it does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that is awkward or impossible today?
      description: >
        A concrete task is more useful than a proposed solution. Describe what you tried
        and where it broke down.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would change
      description: Optional. A sketch is welcome, but the problem above matters more.

  - type: dropdown
    id: layer
    attributes:
      label: Which part does this touch?
      options:
        - Target selection or ranking
        - The verified write path
        - Shadow DOM coverage
        - The visualizer
        - Install, packaging or configuration
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have considered
      description: Especially if you have already tried something.
